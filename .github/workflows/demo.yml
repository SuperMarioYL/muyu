name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-demo-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Regenerate demo-results.json (offline path)
        run: |
          python docs/record_demo_results.py
      - name: Fail if the recorded demo drifted from the shipped one
        run: |
          git diff --exit-code docs/demo-results.json || {
            echo "::error::docs/demo-results.json drifted — regenerate and commit it"
            exit 1
          }
